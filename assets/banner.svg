<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
      .tag-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #38bdf8;
        letter-spacing: 1.5px;
      }

      /* Animated SVG Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-2deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.35; stroke-dashoffset: 0; }
        50% { opacity: 0.85; stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); transform-origin: 1020px 210px; }
        100% { transform: rotate(360deg); transform-origin: 1020px 210px; }
      }
      @keyframes glowOrb {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.7; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatFast 6s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-line {
        stroke-dasharray: 8 8;
        animation: pulseBeam 4s linear infinite;
      }
      .glow-sphere {
        animation: glowOrb 8s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs -->
  <circle class="glow-sphere" cx="150" cy="80" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="glow-sphere" cx="1080" cy="340" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" />
  <circle class="glow-sphere" cx="950" cy="100" r="120" fill="url(#glowGrad1)" filter="url(#blurFilter)" />

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="760" y1="0" x2="760" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
  </g>

  <!-- Dynamic Animated Tech Elements (Right Flank / Background Accents) -->
  <g opacity="0.75">
    <!-- Connecting circuit paths with animated dashes -->
    <path class="pulse-line" d="M 840 90 L 930 90 L 990 150 L 1120 150" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="pulse-line" d="M 860 330 L 940 330 L 1000 270 L 1110 270" fill="none" stroke="#818cf8" stroke-width="2" />
    
    <!-- Test Status Node 1 (Green / Passed) -->
    <circle cx="840" cy="90" r="5" fill="#10b981" />
    <circle cx="990" cy="150" r="5" fill="#38bdf8" />
    
    <!-- Test Status Node 2 (Blue / Running) -->
    <circle cx="860" cy="330" r="5" fill="#818cf8" />
    <circle cx="1000" cy="270" r="5" fill="#10b981" />
  </g>

  <!-- Interactive Dynamic Animated Cards (Positioned safely to the right) -->
  <!-- Floating Dashboard Card 1: Regression Test Runner Matrix -->
  <g class="floating-card-1" filter="url(#shadowFilter)">
    <rect x="880" y="70" width="260" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="905" cy="95" r="7" fill="#10b981" />
    <text x="922" y="99" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Suite: E2E Regression</text>
    <rect x="905" y="115" width="210" height="6" rx="3" fill="#1e293b" />
    <rect x="905" y="115" width="186" height="6" rx="3" fill="#10b981" />
    
    <!-- Sub-metrics -->
    <text x="905" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total: 842 tests</text>
    <text x="980" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">Passed: 839</text>
    <text x="1062" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">Flaky: 0</text>
    <text x="905" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">⚡ Execution: 3m 12s (-68% CI)</text>
  </g>

  <!-- Floating Dashboard Card 2: AI Autonomous Self-Healing Locator -->
  <g class="floating-card-2" filter="url(#shadowFilter)">
    <rect x="830" y="225" width="280" height="135" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="855" cy="250" r="7" fill="#818cf8" />
    <text x="872" y="254" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Self-Healing Locator Active</text>
    <rect x="855" y="270" width="230" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
    <text x="865" y="286" fill="#a5b4fc" font-family="monospace" font-size="10.5">button#submit → data-test=buy</text>
    <text x="855" y="318" fill="#10b981" font-family="system-ui, sans-serif" font-weight="600" font-size="11">✔ 100% Zero-Breakage Verified</text>
    <text x="855" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Parallel Cloud Grid: 32 Worker Nodes</text>
  </g>

  <!-- Foreground Title and Content Section (Strictly Clear, Unobstructed Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="225" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18.5" class="tag-text">CONTINUOUS QUALITY ASSURANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" class="title-text">
      Awesome Automated<tspan fill="url(#accentGrad)"> Regression</tspan>
    </text>
    <text x="0" y="202" class="title-text">
      Test Suites
    </text>

    <!-- Subtitle -->
    <text x="0" y="244" class="subtitle-text">
      Curated benchmarks, enterprise SaaS platforms, and open-source frameworks
    </text>
    <text x="0" y="270" class="subtitle-text">
      for zero-breakage CI/CD continuous delivery.
    </text>

    <!-- Feature Attribute Pills (Foreground) -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="138" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
        <text x="31" y="22" class="pill-text" fill="#e2e8f0">E2E Testing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="154" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4.5" fill="#10b981" />
        <text x="31" y="22" class="pill-text" fill="#e2e8f0">Parallel Grids</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4.5" fill="#c084fc" />
        <text x="31" y="22" class="pill-text" fill="#e2e8f0">AI Self-Healing</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(496, 0)">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4.5" fill="#f59e0b" />
        <text x="31" y="22" class="pill-text" fill="#e2e8f0">API Regression</text>
      </g>
    </g>
  </g>
</svg>
